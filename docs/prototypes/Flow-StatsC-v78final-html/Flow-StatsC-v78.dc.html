<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>v7.8 Flow 卡片 · 休息中只留 Skip</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
.stack-card{transition:top .42s cubic-bezier(.32,.72,0,1),transform .42s cubic-bezier(.32,.72,0,1),opacity .42s cubic-bezier(.32,.72,0,1),box-shadow .42s ease}
.fade{transition:opacity .3s ease}
.pillwrap{transition:top .42s cubic-bezier(.32,.72,0,1),right .42s cubic-bezier(.32,.72,0,1),width .3s cubic-bezier(.32,.72,0,1)}
.pillbody{transition:width .3s cubic-bezier(.32,.72,0,1)}
.pic{transition:opacity .22s ease}
.pi{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;color:rgba(255,255,255,0.88);transition:background .15s ease,opacity .22s ease;cursor:pointer}
.pi:hover{background:rgba(255,255,255,0.20)}
.ib{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;color:rgba(255,255,255,0.58);transition:background .15s ease,color .15s ease;cursor:pointer}
.ib:hover{background:rgba(255,255,255,0.16);color:#fff}
.lb{height:32px;border-radius:16px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:590;white-space:nowrap;cursor:pointer;transition:background .3s ease,opacity .3s ease,filter .15s ease}
.lb:hover{filter:brightness(1.12)}
.chip{padding:5px 10px;border-radius:12px;font-size:11px;font-weight:500;cursor:pointer;color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.08);box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.14)}
</style>
</helmet>
<div style="width: 420px; height: 780px; box-sizing: border-box; background: radial-gradient(120% 140% at 18% 8%, #3a4a6b 0%, #222a3d 42%, #14161f 100%); position: relative; overflow: hidden">

  <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
    <div class="stack-card" style="{{c.frame}}" onClick="{{c.click}}" onMouseDown="{{c.down}}">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{c.pct}}; background: {{c.fill}}; transition: width .4s ease, background .3s ease;"></div>
      <div style="position: absolute; top: 0; bottom: 0; left: {{c.pct}}; width: 1px; background: {{c.edge}}; transition: left .4s ease, background .3s ease;"></div>

      <div class="fade" style="position: absolute; left: 22px; right: 22px; top: 18px; opacity: {{c.titleTop}};">
        <div style="font-size: 13px; font-weight: 590; color: rgba(255,255,255,0.72); letter-spacing: -0.01em; line-height: 1.2;">{{c.name}}</div>
      </div>

      <div class="fade" style="position: absolute; left: 22px; right: 22px; bottom: 0px; height: {{c.stripH}}; display: flex; align-items: center; gap: 10px; opacity: {{c.titleBottom}}">
        <div style="flex-grow: 1; font-size: 13px; font-weight: 590; color: rgba(255,255,255,0.72); letter-spacing: -0.01em; line-height: 1.2;">{{c.name}}</div>
        <div style="font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.52); font-variant-numeric: tabular-nums;">{{c.stripRight}}</div>
      </div>

      <div class="fade" style="position: absolute; left: 22px; right: 22px; top: 50%; transform: translateY(-50%); opacity: {{c.detail}};">
        <div style="font-size: 54px; font-weight: 500; color: #ffffff; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1;">{{c.big}}</div>
      </div>

      <div class="fade" style="position: absolute; left: 22px; right: 22px; bottom: 18px; display: {{c.evDisp}}; align-items: center; gap: 10px; opacity: {{c.detail}};">
        <div style="flex-grow: 1; font-size: 11px; color: rgba(255,255,255,0.52); font-variant-numeric: tabular-nums;">{{c.range}}</div>
      </div>

      <!-- Flow 底行：四个点 + 重置（+ 统计）。行高 28，中心距底边 28，与按钮中心同一水平线 -->
      <div class="fade" onMouseDown="{{c.btnDown}}" onClick="{{c.btnDown}}" style="position: absolute; left: 22px; bottom: 14px; height: 28px; display: {{c.flowDisp}}; align-items: center; gap: 0; opacity: {{c.detail}};">
        <div style="display: flex; align-items: center; gap: 6px; margin-right: 6.5px;">
          <div style="{{c.d1}}"></div>
          <div style="{{c.d2}}"></div>
          <div style="{{c.d3}}"></div>
          <div style="{{c.d4}}"></div>
        </div>
        <div class="ib" onClick="{{c.resetClick}}" onMouseDown="{{c.btnDown}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></div>
        <div class="ib" onClick="{{c.statsClick}}" onMouseDown="{{c.btnDown}}" style="display: flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg></div>
      </div>

      <!-- 次按钮：Skip，在 Start 左边（休息态） -->
      <div class="lb" onClick="{{c.skipClick}}" onMouseDown="{{c.btnDown}}" style="position: absolute; right: 112px; bottom: 12px; width: 64px; display: {{c.skipDisp}}; color: rgba(255,255,255,0.82); background: rgba(255,255,255,0.12); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.3), inset 0 0 0 0.5px rgba(255,255,255,0.14); opacity: {{c.detail}};">Skip</div>

      <!-- 主按钮：右 12 / 下 12（休息态上移到 52），高 32 全圆角，与卡片圆角 28 同心（28 - 16 = 12） -->
      <div class="lb" onClick="{{c.btnClick}}" onMouseDown="{{c.btnDown}}" style="position: absolute; right: 12px; bottom: 12px; width: 92px; display: {{c.flowDisp}}; color: {{c.primColor}}; background: {{c.primBg}}; box-shadow: {{c.primShadow}}; opacity: {{c.detail}};">
        <svg style="display: {{c.playDisp}};" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="7 4 20 12 7 20 7 4" fill="currentColor"></polygon></svg>
        <svg style="display: {{c.pauseDisp}};" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"></rect><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"></rect></svg>
        <span>{{c.label}}</span>
      </div>
    </div>
  </sc-for>

  <div class="pillwrap" style="{{pillWrap}}" onMouseEnter="{{pillEnter}}" onMouseLeave="{{pillLeave}}">
    <div class="pillbody" style="{{pillBody}}">
      <div class="pi pic" onClick="{{tipFocus}}" style="opacity: {{pillIconOp}};"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg></div>
      <div class="pi pic" onClick="{{tipStats}}" style="opacity: {{pillIconOp}}; display: flex;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg></div>
      <div class="pi pic" onClick="{{tipCal}}" style="opacity: {{pillIconOp}};"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></div>
      <div class="pi" onClick="{{tipGear}}" style="position: relative;"><svg style="position: absolute; opacity: {{chevOp}}; transition: opacity .22s ease;" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg><svg style="position: absolute; opacity: {{gearOp}}; transition: opacity .22s ease;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 592px; display: flex; justify-content: center; pointer-events: none; opacity: {{toastOp}}; transition: opacity .25s ease;">
    <div style="font-size: 11px; color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.14); padding: 4px 12px; border-radius: 12px; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.2);">{{toast}}</div>
  </div>

  <div style="position: absolute; left: 40px; right: 40px; top: 618px;">
    <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.52); margin-right: 2px;">Flow 状态</div>
      <sc-for list="{{chips}}" as="h" hint-placeholder-count="4">
        <div class="chip" onClick="{{h.click}}" style="{{h.style}}">{{h.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 40px; right: 40px; top: 664px;">
    <div style="font-size: 12px; font-weight: 600; color: #ffffff;">C · 统计两处都有</div>
    <div style="font-size: 11px; line-height: 1.5; color: rgba(255,255,255,0.52); margin-top: 4px;">卡片底行有统计图标（看这张卡相关的专注时间），浮窗里也有统计（看全局）。入口最多、最容易找到，代价是同一个图标在界面上出现两次。浮窗行为同 A、B。</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":780}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toast: '', expanded: false, order: ['ev1', 'ev2', 'flow'], pillHover: false, drag: null, phase: 'focus' };
    this.suppressClick = false;
  }

  tip(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.setState({ toast: '' }), 1500);
  }

  rgba(rgb, a) { return 'rgba(' + rgb + ',' + a + ')'; }

  renderVals() {
    const PILL_ICONS = 4;
    const CARD_H = 160, PEEK = 21, GAP = 10, RADIUS = 28, SHRINK = 0.04, STEP = CARD_H + GAP;
    const PILL_H = 34, PILL_GAP = 12;
    const Y0C = 40;                       // 收起时最上面那张卡的顶端，也是整体的最高点
    const Y0E = Y0C + PILL_H + PILL_GAP;  // 展开后第一张卡下移，让出快捷动作栏
    const P = {
      idle:        { name: 'Focus',        big: '25:00', pct: 0,   dots: ['todo','todo','todo','todo'],  label: 'Start',  play: true,  skip: false, ghost: false },
      focus:       { name: 'Focus',        big: '18:42', pct: 25,  dots: ['done','cur','todo','todo'],  label: 'Pause',  play: false, skip: false, ghost: true },
      focusPaused: { name: 'Focus',        big: '18:42', pct: 25,  dots: ['done','cur','todo','todo'],  label: 'Resume', play: true,  skip: false, ghost: false },
      breakWait:   { name: 'Take a Break', big: '05:00', pct: 100, dots: ['done','done','todo','todo'], label: 'Start',  play: true,  skip: true, ghost: false },
      breakRun:    { name: 'Take a Break', big: '03:21', pct: 67,  dots: ['done','done','todo','todo'], label: 'Skip',   play: false, skip: false, ghost: true, noicon: true },
    };
    const ph = P[this.state.phase];
    const DATA = {
      ev1: { name: 'EK 210 Lab', big: '23:47', range: '10:10 – 12:00', pct: 78, accent: '10,132,255', flow: false, strip: '23:47' },
      ev2: { name: 'Team Standup', big: '12:30', range: '11:45 – 12:00', pct: 15, accent: '172,142,104', flow: false, strip: '12:30' },
      flow: { name: ph.name, big: ph.big, range: '', pct: ph.pct, accent: '48,209,88', flow: true, strip: ph.big }
    };
    const expanded = this.state.expanded;
    const order = this.state.order;
    const drag = this.state.drag;
    const n = order.length;
    const idle = this.state.phase === 'idle';

    const slotTop = (i) => expanded ? Y0E + i * STEP : Y0C + i * PEEK;

    const dot = (k) => {
      const base = 'height: 8px; border-radius: 4px; flex: none; transition: width .3s ease, background .3s ease; ';
      if (k === 'done') return base + 'width: 8px; background: rgba(255,255,255,0.85)';
      if (k === 'cur') return base + 'width: 26px; background: rgba(255,255,255,0.35)';
      return base + 'width: 8px; background: rgba(255,255,255,0.22)';
    };

    const primary = () => {
      const s = this.state.phase;
      const next = { idle: 'focus', focus: 'focusPaused', focusPaused: 'focus', breakWait: 'breakRun', breakRun: 'idle' };
      this.setState({ phase: next[s] });
    };

    const cards = order.map((id, i) => {
      const d = DATA[id];
      const dragging = drag && drag.id === id;
      const top = dragging ? drag.top : slotTop(i);
      const scale = expanded ? 1 : 1 - SHRINK * i;
      const glassA = expanded ? 0.10 : 0.10 - i * 0.015;
      const shadow = dragging ? 0.55 : (expanded ? 0.34 : 0.40 - i * 0.08);
      const full = expanded || i === 0;
      const frame = [
        'position: absolute', 'left: 40px', 'width: 340px',
        'top: ' + top + 'px', 'height: ' + CARD_H + 'px',
        'border-radius: ' + RADIUS + 'px', 'overflow: hidden',
        'transform: scale(' + (dragging ? 1.02 : scale).toFixed(3) + ')',
        'transform-origin: ' + (expanded ? 'center center' : 'center bottom'),
        'z-index: ' + (dragging ? 60 : n - i),
        'cursor: ' + (expanded ? (dragging ? 'grabbing' : 'grab') : 'default'),
        'background: rgba(255,255,255,' + glassA.toFixed(3) + ')',
        'backdrop-filter: blur(24px) saturate(180%)',
        '-webkit-backdrop-filter: blur(24px) saturate(180%)',
        'box-shadow: inset 0 1px 0 rgba(255,255,255,0.30), inset 0 -1px 0 rgba(255,255,255,0.07), inset 0 0 0 0.5px rgba(255,255,255,0.16), 0 10px 28px rgba(0,0,0,' + shadow.toFixed(2) + ')'
      ];
      if (dragging) frame.push('transition: none');
      const fillOn = !(d.flow && idle);
      return {
        name: d.name, big: d.big, range: d.range, pct: d.pct + '%', stripRight: d.strip,
        fill: 'linear-gradient(180deg, ' + this.rgba(d.accent, fillOn ? 0.34 : 0) + ' 0%, ' + this.rgba(d.accent, fillOn ? 0.20 : 0) + ' 100%)',
        edge: this.rgba(d.accent, fillOn ? 0.55 : 0),
        titleTop: full ? '1' : '0',
        titleBottom: full ? '0' : '1',
        detail: full ? '1' : '0',
        evDisp: d.flow ? 'none' : 'flex',
        flowDisp: d.flow ? 'flex' : 'none',
        skipDisp: (d.flow && ph.skip) ? 'flex' : 'none',
        stripH: (PEEK / scale).toFixed(2) + 'px',
        d1: dot(ph.dots[0]), d2: dot(ph.dots[1]), d3: dot(ph.dots[2]), d4: dot(ph.dots[3]),
        playDisp: (!ph.noicon && ph.play) ? 'block' : 'none',
        pauseDisp: (!ph.noicon && !ph.play) ? 'block' : 'none',
        label: ph.label,
        primColor: ph.ghost ? 'rgba(255,255,255,0.88)' : '#ffffff',
        primBg: ph.ghost ? 'rgba(255,255,255,0.12)' : 'rgba(48,209,88,0.55)',
        primShadow: ph.ghost ? 'inset 0 0.5px 0 rgba(255,255,255,0.3), inset 0 0 0 0.5px rgba(255,255,255,0.14)' : 'inset 0 1px 0 rgba(255,255,255,0.35), inset 0 0 0 0.5px rgba(255,255,255,0.2)',
        btnClick: (e) => { e.stopPropagation(); primary(); },
        skipClick: (e) => { e.stopPropagation(); this.setState({ phase: 'idle' }); },
        resetClick: (e) => { e.stopPropagation(); this.setState({ phase: 'idle' }); this.tip('重置本轮四节'); },
        statsClick: (e) => { e.stopPropagation(); this.tip('打开统计（本卡入口）'); },
        btnDown: (e) => { e.stopPropagation(); },
        frame: frame.join('; '),
        click: () => {
          if (this.suppressClick) return;
          this.setState({ expanded: !this.state.expanded });
        },
        down: (e) => {
          if (!this.state.expanded) return;
          if (e.button !== undefined && e.button !== 0) return;
          const startY = e.clientY;
          const idx0 = this.state.order.indexOf(id);
          const startTop = Y0E + idx0 * STEP;
          let moved = false;
          const move = (ev) => {
            const dy = ev.clientY - startY;
            if (!moved && Math.abs(dy) < 5) return;
            moved = true;
            const top2 = startTop + dy;
            const rest = this.state.order.filter((x) => x !== id);
            let t = Math.round((top2 - Y0E) / STEP);
            t = Math.max(0, Math.min(rest.length, t));
            rest.splice(t, 0, id);
            this.setState({ order: rest, drag: { id: id, top: top2 } });
          };
          const up = () => {
            window.removeEventListener('mousemove', move);
            window.removeEventListener('mouseup', up);
            if (moved) {
              this.suppressClick = true;
              setTimeout(() => { this.suppressClick = false; }, 0);
              this.setState({ drag: null });
            }
          };
          window.addEventListener('mousemove', move);
          window.addEventListener('mouseup', up);
        }
      };
    });

    // 浮窗：收起时叠在顶牌右上角（齿轮圆，悬停展开）；展开后上移到整体右上角，顶端对齐收起时第一张卡的顶端
    const CIRCLE = 34, PILL_W = PILL_ICONS * 30 + 4;
    const open = expanded || this.state.pillHover;
    const w = open ? PILL_W : CIRCLE;
    const pillTop = expanded ? Y0C : Y0C + 14;
    const rightEdge = expanded ? 40 : 58;
    const pillWrap = [
      'position: absolute', 'z-index: 200',
      'right: ' + (rightEdge - 10) + 'px', 'top: ' + (pillTop - 10) + 'px',
      'width: ' + (w + 20) + 'px', 'height: 54px', 'box-sizing: border-box', 'padding: 10px'
    ].join('; ');
    const pillBody = [
      'width: ' + w + 'px', 'height: 34px', 'box-sizing: border-box', 'border-radius: 17px', 'overflow: hidden',
      'display: flex', 'align-items: center', 'justify-content: flex-end', 'padding: 0 2px',
      'background: rgba(255,255,255,0.20)',
      'backdrop-filter: blur(20px) saturate(180%)', '-webkit-backdrop-filter: blur(20px) saturate(180%)',
      'box-shadow: inset 0 1px 0 rgba(255,255,255,0.40), inset 0 0 0 0.5px rgba(255,255,255,0.25), 0 4px 14px rgba(0,0,0,0.25)'
    ].join('; ');

    const chipDefs = [['idle', '空闲'], ['focus', '专注中'], ['breakWait', '休息 待开始'], ['breakRun', '休息中']];
    const cur = this.state.phase;
    const chips = chipDefs.map((p) => {
      const on = (cur === p[0]) || (p[0] === 'focus' && cur === 'focusPaused');
      return {
        label: p[1],
        click: () => this.setState({ phase: p[0] }),
        style: on ? 'color: #ffffff; background: rgba(48,209,88,0.40);' : ''
      };
    });

    return {
      cards: cards, chips: chips,
      pillWrap: pillWrap, pillBody: pillBody,
      pillIconOp: open ? '1' : '0', gearOp: open ? '1' : '0', chevOp: open ? '0' : '1',
      toast: this.state.toast, toastOp: this.state.toast ? '1' : '0',
      tipFocus: () => this.tip('专注入口'), tipStats: () => this.tip('打开统计（快捷菜单入口）'), tipCal: () => this.tip('打开日历'), tipGear: () => this.tip('打开设置（App 级）'),
      pillEnter: () => this.setState({ pillHover: true }),
      pillLeave: () => this.setState({ pillHover: false })
    };
  }
}
</script>
</body>
</html>
